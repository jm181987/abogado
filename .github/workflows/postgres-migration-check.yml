name: Postgres migration check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Verify retired backend name is absent
        run: |
          retired='supa''base'
          if grep -RIni --exclude-dir=node_modules --exclude-dir=.git -E "$retired" .; then
            echo 'Retired backend reference found'
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run build
